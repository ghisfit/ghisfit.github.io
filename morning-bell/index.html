<!doctype html><html><head><meta charset=utf8><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0B0A09"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Morning Bell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --ground:#0B0A09;
  --panel:#161412;
  --panel-2:#1F1B18;
  --line:#2E2823;
  --line-soft:#221E1A;
  --ink:#F1EDE8;
  --dim:#948B82;
  --dimmer:#6A635C;

  --prep:#E0A93B;
  --work:#E2543A;
  --rest:#4E9FC4;
  --done:#84BE6B;

  --phase:var(--work);
  --next:var(--rest);

  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --display:"Archivo",var(--sans);

  --r:10px;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{overflow-x:hidden}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--phase);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.wrap{max-width:660px;margin:0 auto;padding:18px 18px 132px}

.topbar{display:flex;align-items:center;gap:12px;padding:4px 0 22px}
.mark{
  font-family:var(--display);
  font-variation-settings:"wdth" 118,"wght" 700;
  font-size:17px;letter-spacing:.06em;text-transform:uppercase;
  display:flex;align-items:baseline;gap:8px;
}
.mark span{color:var(--work)}
.topbar .spacer{flex:1}

.iconbtn{
  width:38px;height:38px;border-radius:var(--r);
  border:1px solid var(--line);
  display:grid;place-items:center;color:var(--dim);
  transition:color .15s,border-color .15s,background .15s;
}
.iconbtn:hover{color:var(--ink);border-color:var(--dim)}
.iconbtn[aria-pressed="false"]{color:var(--dimmer)}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- routine chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
.chip{
  padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);font-size:13.5px;font-weight:500;
  transition:color .15s,border-color .15s,background .15s;
  white-space:nowrap;
}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--ground);font-weight:600}
.chip.add{color:var(--dimmer);border-style:dashed}

/* ---------- session head ---------- */
.sessionhead{display:flex;align-items:flex-end;gap:14px;margin-bottom:14px}
.namefield{
  flex:1;min-width:0;
  font-family:var(--display);
  font-variation-settings:"wdth" 112,"wght" 700;
  font-size:clamp(26px,7vw,34px);
  letter-spacing:-.01em;line-height:1.1;
  background:none;border:none;padding:0;width:100%;
  border-bottom:1px solid transparent;
  transition:border-color .15s;
}
.namefield:hover{border-bottom-color:var(--line)}
.namefield:focus{outline:none;border-bottom-color:var(--phase)}
.total{
  font-family:var(--mono);font-size:14px;color:var(--dim);
  font-variant-numeric:tabular-nums;padding-bottom:5px;white-space:nowrap;
}

/* ---------- ribbon ---------- */
.ribbon{display:flex;gap:1.5px;height:13px;margin-bottom:8px;overflow:hidden;border-radius:3px}
.seg{min-width:2px;border-radius:1px;opacity:.9}
.seg.prep{background:var(--prep)}
.seg.work{background:var(--work)}
.seg.rest{background:var(--rest)}
.seg.cool{background:var(--done)}
.legend{
  display:flex;flex-wrap:wrap;gap:4px 16px;
  font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dimmer);
  margin-bottom:26px;
}
.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;vertical-align:1px}

/* ---------- blocks ---------- */
.sectionlabel{
  font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer);
  margin:0 0 10px;font-weight:500;
}
.stack{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}

.row{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:13px 14px;display:flex;align-items:center;gap:14px;
}
.row .rowlabel{flex:1;font-weight:500}
.row .rowhint{color:var(--dimmer);font-size:12.5px}

.block{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:13px 14px 14px;position:relative;
  border-left:2px solid var(--work);
}
.blockhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.blockname{
  flex:1;min-width:0;background:none;border:none;padding:2px 0;font-weight:600;font-size:15.5px;
  border-bottom:1px solid transparent;
}
.blockname:hover{border-bottom-color:var(--line)}
.blockname:focus{outline:none;border-bottom-color:var(--phase)}
.minibtn{
  width:26px;height:26px;border-radius:6px;color:var(--dimmer);display:grid;place-items:center;flex:none;
  transition:color .15s,background .15s;
}
.minibtn:hover{color:var(--ink);background:var(--panel-2)}
.minibtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.minibtn:disabled{opacity:.25;cursor:default}
.minibtn:disabled:hover{color:var(--dimmer);background:none}

.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}

/* ---------- number field ---------- */
.field{display:flex;flex-direction:column;gap:5px}
.field > span{
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);
  display:flex;justify-content:space-between;align-items:baseline;gap:6px;
}
.field > span em{font-style:normal;font-family:var(--mono);letter-spacing:0;text-transform:none;opacity:.8}
.stepper{
  display:flex;align-items:stretch;background:var(--panel-2);
  border:1px solid var(--line);border-radius:8px;overflow:hidden;
}
.stepper button{
  width:32px;flex:none;color:var(--dim);font-size:17px;line-height:1;
  transition:background .12s,color .12s;
}
.stepper button:hover{background:var(--line);color:var(--ink)}
.stepper button:active{background:var(--phase);color:var(--ground)}
.stepper input{
  flex:1;min-width:0;width:100%;text-align:center;background:none;border:none;
  font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;
  padding:9px 0;
}
.stepper input:focus{outline:none;background:var(--line-soft)}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.ghostbtn{
  border:1px dashed var(--line);border-radius:var(--r);padding:12px;
  color:var(--dim);font-weight:500;width:100%;
  transition:color .15s,border-color .15s;
}
.ghostbtn:hover{color:var(--ink);border-color:var(--dim)}

.footlinks{
  display:flex;gap:18px;padding-top:22px;border-top:1px solid var(--line-soft);
  font-size:12.5px;color:var(--dimmer);flex-wrap:wrap;
}
.footlinks button{color:var(--dimmer);text-decoration:underline;text-underline-offset:3px}
.footlinks button:hover{color:var(--ink)}
.footnote{flex:1;min-width:180px;text-align:right;line-height:1.5}

/* ---------- start bar ---------- */
.startbar{
  position:fixed;left:0;right:0;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--ground) 62%,rgba(11,10,9,0));
  display:flex;justify-content:center;pointer-events:none;z-index:5;
}
.start{
  pointer-events:auto;width:100%;max-width:624px;
  background:var(--work);color:#1A0D09;
  font-family:var(--display);font-variation-settings:"wdth" 116,"wght" 700;
  font-size:19px;letter-spacing:.1em;text-transform:uppercase;
  padding:17px;border-radius:var(--r);
  transition:transform .12s,filter .15s;
}
.start:hover{filter:brightness(1.08)}
.start:active{transform:scale(.985)}

/* ---------- run view ---------- */
.run{
  position:fixed;inset:0;z-index:20;
  background:var(--ground);
  display:none;flex-direction:column;
  padding:0 16px calc(16px + env(safe-area-inset-bottom));
}
.run.on{display:flex}
.run::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(115% 72% at 50% 0%,color-mix(in srgb,var(--phase) 17%,transparent),transparent 72%);
  transition:background .45s ease;
}
.run > *{position:relative}

.rail{height:3px;background:var(--line-soft);flex:none;margin:0 -16px}

/* A change you can see across a room, for when the phone cannot make a sound.
   iOS gives a web page no vibration API either, so light is all that is left. */
.flashlayer{
  position:absolute;inset:0;background:var(--phase);
  opacity:0;pointer-events:none;z-index:6;
}
.flashlayer.go{animation:phaseflash .55s ease-out}
@keyframes phaseflash{
  0%   {opacity:.92}
  55%  {opacity:.38}
  100% {opacity:0}
}
@media (prefers-reduced-motion:reduce){
  .flashlayer.go{animation:none;opacity:0}
}
.railfill{height:100%;background:var(--phase);width:0;transition:width .25s linear}

.runtop{display:flex;align-items:center;gap:12px;padding:14px 0 0;flex:none}
.runtop .roundtag{
  font-family:var(--mono);font-size:12.5px;color:var(--dim);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
.runtop .spacer{flex:1}

.clockzone{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;min-height:0;text-align:center;position:relative;
}

/* last three seconds: the incoming phase colour arrives before the phase does */
.ghostdigit{
  position:absolute;left:50%;top:50%;translate:-50% -50%;
  font-family:var(--display);font-variation-settings:"wdth" 125,"wght" 800;
  font-size:min(58vw,46vh,420px);line-height:1;
  color:var(--next);opacity:0;pointer-events:none;z-index:0;
}
.ghostdigit.pop{animation:cdpop .96s cubic-bezier(.16,.7,.3,1) forwards}
@keyframes cdpop{
  0%   {opacity:0;   scale:.55}
  22%  {opacity:.4;  scale:.9}
  100% {opacity:0;   scale:1.7}
}
.phaselabel{
  font-family:var(--display);font-variation-settings:"wdth" 122,"wght" 700;
  font-size:clamp(15px,4.4vw,20px);letter-spacing:.24em;text-transform:uppercase;
  color:var(--phase);
}
.exercise{
  font-size:clamp(14px,3.6vw,17px);color:var(--dim);font-weight:500;
  max-width:92%;text-wrap:balance;
}
.clock{
  font-family:var(--display);font-variation-settings:"wdth" 114,"wght" 700;
  font-size:min(26.5vw,19vh,168px);line-height:.92;letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;margin:6px 0 2px;
  width:100%;position:relative;z-index:1;
  transition:color .2s ease;
}
.run.counting .clock{color:var(--next)}
.run.counting .steprail{background:color-mix(in srgb,var(--next) 22%,transparent)}
.run.counting .stepfill{background:var(--next)}
.steprail{width:min(100%,420px);height:4px;background:var(--line-soft);border-radius:2px;overflow:hidden;margin-top:10px}
.stepfill{height:100%;background:var(--phase);width:100%}
.nextup{
  margin-top:16px;font-size:13px;color:var(--dimmer);
  letter-spacing:.03em;
}
.nextup b{color:var(--dim);font-weight:500}

.controls{display:flex;align-items:center;justify-content:center;gap:14px;flex:none;padding-top:8px}
.ctl{
  width:58px;height:58px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--dim);flex:none;
  transition:color .15s,border-color .15s,background .15s;
}
.ctl:hover{color:var(--ink);border-color:var(--dim)}
.ctl svg{width:22px;height:22px;fill:currentColor}
.ctl.primary{
  width:86px;height:86px;background:var(--phase);border-color:var(--phase);color:var(--ground);
}
.ctl.primary svg{width:32px;height:32px}
.ctl.primary:hover{filter:brightness(1.08);color:var(--ground)}

.endrow{display:flex;justify-content:center;padding-top:14px;flex:none}
.holdend{
  position:relative;overflow:hidden;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);
  padding:9px 18px;border-radius:999px;border:1px solid var(--line-soft);
  transition:color .15s;
}
.holdend:hover{color:var(--dim)}
.holdend i{
  position:absolute;left:0;top:0;bottom:0;width:0;background:var(--line);z-index:-1;
}
.holdend.arming i{width:100%;transition:width .75s linear}

/* paused dim */
.run.paused .clock{opacity:.4}
.run.paused .phaselabel::after{content:" · paused";opacity:.55}

/* ---------- done ---------- */
.donecard{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;
}
.donecard .big{
  font-family:var(--display);font-variation-settings:"wdth" 120,"wght" 700;
  font-size:clamp(40px,13vw,76px);letter-spacing:-.02em;color:var(--done);line-height:1;
}
.donecard .sub{color:var(--dim);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.donebtns{display:flex;gap:10px;margin-top:26px}
.donebtns button{
  padding:14px 26px;border-radius:var(--r);border:1px solid var(--line);color:var(--dim);
  font-weight:500;letter-spacing:.04em;
}
.donebtns button.go{background:var(--done);border-color:var(--done);color:#0C1607;font-weight:600}

@media (max-width:420px){
  .fields{grid-template-columns:repeat(3,1fr);gap:7px}
  .stepper button{width:27px}
  .wrap{padding:14px 14px 128px}
}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
  .holdend.arming i{transition-duration:.75s !important}
  /* keep the 3-2-1 readable without the scale animation */
  .ghostdigit.pop{opacity:.14;scale:1.15}
}
</style>

<div class="wrap" id="setup">
  <div class="topbar">
    <div class="mark">Morning<span>Bell</span></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="soundBtn" aria-pressed="true" title="Sound on/off" aria-label="Sound on or off">
      <svg viewBox="0 0 24 24" id="soundIcon"></svg>
    </button>
    <button class="iconbtn" id="voiceBtn" aria-pressed="false" title="Count the last 3 seconds out loud" aria-label="Count the last 3 seconds out loud">
      <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 013 3v5a3 3 0 01-6 0V6a3 3 0 013-3z"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"/></svg>
    </button>
    <button class="iconbtn" id="vibeBtn" aria-pressed="true" title="Vibrate on phase change" aria-label="Vibrate on phase change">
      <svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 9v6M21 9v6"/></svg>
    </button>
  </div>

  <div class="chips" id="chips"></div>

  <div class="sessionhead">
    <input class="namefield" id="routineName" aria-label="Routine name" spellcheck="false">
    <div class="total" id="totalTime">—</div>
  </div>

  <div class="ribbon" id="ribbon"></div>
  <div class="legend">
    <span><i style="background:var(--prep)"></i>Get ready</span>
    <span><i style="background:var(--work)"></i>Work</span>
    <span><i style="background:var(--rest)"></i>Rest</span>
    <span><i style="background:var(--done)"></i>Cool down</span>
  </div>

  <p class="sectionlabel">Before you start</p>
  <div class="stack">
    <div class="row">
      <span class="rowlabel">Get ready<br><span class="rowhint">Countdown before the first round</span></span>
      <div style="width:132px" id="prepMount"></div>
    </div>
  </div>

  <p class="sectionlabel">Rounds</p>
  <div class="stack" id="blocks"></div>
  <button class="ghostbtn" id="addBlock" style="margin-bottom:26px">+ Add another set of rounds</button>

  <p class="sectionlabel">After the last round</p>
  <div class="stack">
    <div class="row">
      <span class="rowlabel">Cool down<br><span class="rowhint">Set to 0 to finish on the last round</span></span>
      <div style="width:132px" id="coolMount"></div>
    </div>
  </div>

  <div class="footlinks">
    <button id="dupBtn">Duplicate</button>
    <button id="delBtn">Delete</button>
    <button id="testBtn">Test beep</button>
    <button id="engineBtn">Beeps: with music</button>
    <button id="levelBtn">Beep: medium</button>
    <button id="exportBtn">Copy backup</button>
    <button id="importBtn">Restore</button>
    <span class="footnote" id="audioStatus">Saved on this device. Works offline.</span>
  </div>
</div>

<div class="startbar">
  <button class="start" id="startBtn" type="button">Start</button>
</div>

<div class="run" id="run" role="dialog" aria-label="Timer running">
  <div class="flashlayer" id="flash" aria-hidden="true"></div>
  <div class="rail"><div class="railfill" id="railFill"></div></div>

  <div class="runtop">
    <span class="roundtag" id="roundTag"></span>
    <span class="roundtag" id="voiceTag" style="opacity:.7;margin-left:10px"></span>
    <span class="spacer"></span>
    <span class="roundtag" id="leftTag"></span>
  </div>

  <div class="clockzone" id="clockZone">
    <div class="ghostdigit" id="ghost" aria-hidden="true"></div>
    <div class="phaselabel" id="phaseLabel">Work</div>
    <div class="exercise" id="exerciseLabel"></div>
    <div class="clock" id="clock">00:00</div>
    <div class="steprail"><div class="stepfill" id="stepFill"></div></div>
    <div class="nextup" id="nextUp"></div>
  </div>

  <div class="donecard" id="doneCard" hidden>
    <div class="big">Done</div>
    <div class="sub" id="doneSub"></div>
    <div class="donebtns">
      <button class="go" id="againBtn">Run it again</button>
      <button id="closeBtn">Back to setup</button>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="ctl" id="prevBtn" aria-label="Previous step"><svg viewBox="0 0 24 24"><path d="M7 5h2.5v14H7zM19 5v14l-9-7z"/></svg></button>
    <button class="ctl primary" id="playBtn" aria-label="Pause"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
    <button class="ctl" id="skipBtn" aria-label="Next step"><svg viewBox="0 0 24 24"><path d="M14.5 5H17v14h-2.5zM5 5v14l9-7z"/></svg></button>
  </div>

  <div class="endrow" id="endRow">
    <button class="holdend" id="endBtn"><i></i>Hold to end</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* Claim the audio session FIRST — before any AudioContext or <audio> exists.
   WebKit fixes the page's category when the first audio object is created, so
   asking afterwards does nothing, which is why every earlier attempt read back
   as "auto". "transient" is the category a beep wants: audible regardless of
   Silent Mode, and it ducks other audio for its length instead of seizing the
   session, so music carries on. Native timer apps do exactly this through
   AVAudioSession; this is the same knob exposed to the web. */
function claimAudioSession(){
  try {
    if(navigator.audioSession && navigator.audioSession.type !== "transient")
      navigator.audioSession.type = "transient";
  } catch(e){}
}
claimAudioSession();

/* ============================ data ============================ */

var KEY = "morningbell.v1";
var uid = function(){ return Math.random().toString(36).slice(2,9); };

function defaultState(){
  return {
    activeId: "seed",
    sound: true,
    vibrate: true,
    voice: true,
    engine: "media",
    beepLevel: 2,
    routines: [{
      id: "seed",
      name: "Morning",
      prepare: 5,
      cooldown: 0,
      blocks: [
        { id: uid(), name: "Mobility", work: 30, rest: 5, rounds: 50 }
      ]
    }]
  };
}

var state;
try {
  var raw = localStorage.getItem(KEY);
  state = raw ? JSON.parse(raw) : defaultState();
} catch(e){ state = defaultState(); }
if(!state || !state.routines || !state.routines.length) state = defaultState();
// settings added after a save already existed on this device
if(typeof state.voice !== "boolean") state.voice = true;
if(!(state.beepLevel >= 1 && state.beepLevel <= 3)) state.beepLevel = 2;
if(state.engine !== "tone" && state.engine !== "media") state.engine = "tone";

/* One-time correction. "media" was a default I picked while chasing a silent
   phone, and it turned out to stop Spotify — not a choice anyone made, so it
   gets overridden once rather than left for the user to undo by hand. The
   morning numbers were asked for directly; a routine the user has since added
   to is left alone. */
if(state.rev !== 3){
  if(!state.rev && state.routines.length === 1){
    var seed = defaultState().routines[0];
    seed.id = state.routines[0].id;
    state.routines = [seed];
    state.activeId = seed.id;
  }
  // Web Audio is the one path iOS silences under Silent Mode, but it is also the

        // to a voice even at full scale, which is what a decaying beep is.
        if(s < atk)            env = s / atk;

  // the long tones instead of sitting a few dB below them

  return chosenVoice;
}

if(synth){
  pickVoice();
  try { synth.addEventListener("voiceschanged", function(){ chosenVoice = null; pickVoice(); }); } catch(e){}
}

function sayCue(kind, lead){
  if(!state.voice || !synth || state.engine === "media") return;
  var w = WORDS[kind];
  if(!w) return;
  if(lead <= 0.02){ sayNow(w, 1, true); return; }
  var id = setTimeout(function(){ sayNow(w, 1, true); }, lead * 1000);
  mediaTimers.push({ id:id, tag:"change" });
}

/* No cancel() before speak(). Cancelling and immediately speaking is a WebKit
   race that drops the new utterance outright — over fifty rounds that is the
   other half of a missing "2" or a missing "Go". Cues are a second apart and a
   word takes ~400ms, so the queue never backs up and there is nothing to clear.
   Cancelling stays where it belongs: pause, skip, and ending a session.

   `must` marks the words that carry the timer. Safari's speech queue does wedge
   over a long session, so if one never starts it gets a single retry. */
function sayNow(n, vol, must, isRetry){
  if(!state.voice || !synth) return;

  var u;
  try { u = new SpeechSynthesisUtterance(String(n)); } catch(e){ return; }

  /* Every step below is optional and wrapped on its own. A single try around
     the whole function meant one rejected property — a voice object the browser
     would not take, say — threw before speak() and killed the utterance with no
     error and no sound. Nothing here may be allowed to take speak() down. */
  // Deliberately NOT setting u.voice. Naming a voice iOS has not downloaded
  // makes it speak nothing at all, silently. The default voice always works.
  try { u.lang = "en-US"; } catch(e){}
  // brisk on purpose: a shorter utterance clears the queue sooner for the word
  // behind it, and these are single syllables, not prose
  try { u.rate = 1.45; u.pitch = 1; } catch(e){}
  try { u.volume = typeof vol === "number" ? vol : 0.75; } catch(e){}

  // Safari parks the queue when the page is backgrounded and never restarts it
  try { if(synth.paused) synth.resume(); } catch(e){}

  /* Report what iOS does with the utterance, but only when it goes wrong.
     Speech failing here is silent by design — no throw, no error event in most
     cases — so without this there is nothing to tell "the phone refused" apart
     from "the app never asked". When it works the tag stays empty. */
  var started = false, settled = false;
  var settle = function(){ if(!settled){ settled = true; speechQueued = Math.max(0, speechQueued - 1); } };
  try {
    u.onstart = function(){ started = true; markVoice(""); };   // silence is success
    u.onend   = settle;
    u.onerror = function(ev){ settle(); markVoice("voice error: " + ((ev && ev.error) || "?")); };
  } catch(e){}

  /* NO retry, and above all no cancel(). iOS speech can take seconds to start
     the first time — its engine is cold. A watchdog that gave up at 900ms and
     called cancel() did not just drop that word: cancel() wipes the WHOLE
     queue, taking the counts waiting behind it. On a slow phone that meant
     nothing ever spoke, while the one path without the watchdog (the test
     button) worked after a long pause. Be patient instead; late speech is
     fine, and a cancel is never recoverable. */
  try {
    setTimeout(function(){ if(!started) markVoice("voice slow"); }, 2500);
  } catch(e){}

  lastSpokeAt = Date.now();
  try { speechQueued++; synth.speak(u); } catch(e){ settle(); markVoice("voice threw"); }
}
function flashScreen(){
  var el = document.getElementById("flash");
  if(!el) return;
  el.classList.remove("go");
  void el.offsetWidth;            // restart the animation
  el.classList.add("go");
}

function markVoice(s){
  var el = document.getElementById("voiceTag");
  if(el) el.textContent = s;
}

function hushVoice(){
  if(voiceTimer){ clearTimeout(voiceTimer); voiceTimer = null; }
  speechQueued = 0;                // cancel() fires no end events; reset by hand
  if(synth){ try { synth.cancel(); } catch(e){} }
}


function primeVoice(){
  // iOS only allows speech that descends from a tap, so warm it up on Start
  if(!state.voice || !synth) return;
  try {
    var u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    synth.speak(u);
  } catch(e){}
}

/* ============================ wake lock ============================ */

var lock = null;
function keepScreenOn(on){
  if(!("wakeLock" in navigator)) return;
  if(on){
    navigator.wakeLock.request("screen").then(function(l){
      lock = l;
      l.addEventListener("release", function(){ lock = null; });
    }).catch(function(){});
  } else if(lock){
    try { lock.release(); } catch(e){}
    lock = null;
  }
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible" && run.active && !run.paused){
    keepScreenOn(true);
    ensureAudio();          // the context is usually suspended on the way back
  }
});

/* ============================ number field ============================ */

function numberField(opts){
  // opts: {label, value, min, max, step, suffix, onChange, showMinutes}
  var wrap = document.createElement("label");
  wrap.className = "field";

  var head = document.createElement("span");
  var title = document.createElement("b");
  title.style.fontWeight = "500";
  title.textContent = opts.label;
  var aside = document.createElement("em");
  head.appendChild(title); head.appendChild(aside);

  var box = document.createElement("div");
  box.className = "stepper";

  var minus = document.createElement("button");
  minus.type = "button"; minus.textContent = "−";
  minus.setAttribute("aria-label", "Decrease " + opts.label);

  var input = document.createElement("input");
  input.type = "text";
  input.inputMode = "numeric";
  input.setAttribute("aria-label", opts.label);

  var plus = document.createElement("button");
  plus.type = "button"; plus.textContent = "+";
  plus.setAttribute("aria-label", "Increase " + opts.label);

  var value = opts.value;

  function clamp(v){
    if(isNaN(v)) v = opts.min;
    return Math.max(opts.min, Math.min(opts.max, Math.round(v)));
  }
  function paint(){
    input.value = String(value);
    aside.textContent = opts.showMinutes && value >= 60 ? mmss(value) : (opts.suffix || "");
  }
  function set(v, quiet){
    value = clamp(v);
    paint();
    if(!quiet) opts.onChange(value);
  }

  minus.addEventListener("click", function(){ set(value - opts.step); });
  plus.addEventListener("click", function(){ set(value + opts.step); });
  input.addEventListener("input", function(){
    var v = parseInt(input.value.replace(/[^0-9]/g, ""), 10);
    if(input.value === "") return;
    value = clamp(v); aside.textContent = opts.showMinutes && value >= 60 ? mmss(value) : (opts.suffix || "");
    opts.onChange(value);
  });
  input.addEventListener("blur", function(){ set(parseInt(input.value, 10)); });
  input.addEventListener("keydown", function(e){
    if(e.key === "ArrowUp"){ e.preventDefault(); set(value + opts.step); }
    if(e.key === "ArrowDown"){ e.preventDefault(); set(value - opts.step); }
    if(e.key === "Enter") input.blur();
  });

  box.appendChild(minus); box.appendChild(input); box.appendChild(plus);
  wrap.appendChild(head); wrap.appendChild(box);
  paint();
  return wrap;
}

/* Says out loud what the browser's audio engine is actually doing, because
   "no sound" has half a dozen causes that look identical from the outside. */
function paintAudioStatus(extra){
  var el = $("audioStatus"), bits = [];
  if(!AC) bits.push("This browser has no Web Audio — beeps cannot play.");
  else if(!ctx) bits.push("Audio opens on your first tap.");
  else bits.push("Audio: " + ctx.state);
  try {
    if(navigator.audioSession && navigator.audioSession.type)
      bits.push("route: " + navigator.audioSession.type);
  } catch(e){}
  bits.push("engine: " + state.engine);
  try {
    var standalone = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    bits.push(standalone ? "home-screen app" : "browser tab");
  } catch(e){}
  if(!state.sound) bits.push("MUTED IN THE APP — tap the speaker icon");
  $("levelBtn").textContent = "Beep: " + LEVEL_NAMES[(state.beepLevel || 2) - 1];
  $("engineBtn").textContent = state.engine === "tone" ? "Beeps: with music" : "Beeps: over silent";
  if(extra) bits.push(extra);
  el.textContent = bits.join(" · ");
}

/* The engine button is gone on purpose. Playing a media clip takes iOS's audio
   session and stops whatever else is playing — and the one rule here is that
   music never stops. Leaving a button that could do it was a footgun, not a
   choice. The media code stays for the test below only. */

$("engineBtn").addEventListener("click", function(){
  state.engine = state.engine === "tone" ? "media" : "tone";
  save();
  unlockAudio(); unlockMedia(true);
  var keep = state.sound;
  state.sound = true;
  emit("work", 0.03, null);
  state.sound = keep;
  paintAudioStatus(state.engine === "tone"
    ? "mixes with music, needs Silent Mode OFF"
    : "plays in Silent Mode, but music will stop");
  setTimeout(function(){ paintAudioStatus(); }, 5000);
});

$("levelBtn").addEventListener("click", function(){
  state.beepLevel = (state.beepLevel || 2) % 3 + 1;   // soft → medium → loud → soft
  save();

/* ============================ run engine ============================ */

var run = {
  active: false, paused: false, done: false,
  steps: [], i: 0, cues: null,
  endAt: 0,        // wall-clock ms when the current step ends
  leftWhenPaused: 0,
  elapsedBefore: 0 // seconds of steps already completed
};

var PHASE_VAR = { prep:"--prep", work:"--work", rest:"--rest", cool:"--done" };

function startRun(){
  var steps = compile(routine());
  if(!steps.length){ alert("Add at least one round before starting."); return; }
  ensureAudio();
  run.steps = steps; run.i = 0; run.active = true; run.paused = false; run.done = false;
  run.elapsedBefore = 0;
  $("run").classList.add("on");
  $("run").classList.remove("paused");
  setPausedIcon(false);
  $("playBtn").setAttribute("aria-label", "Pause");
  $("doneCard").hidden = true;
  $("clockZone").hidden = false;
  $("controls").hidden = false;
  $("endRow").hidden = false;
  keepScreenOn(true);
  enterStep(0, true);
  if(!run.looping){ run.looping = true; tick(); }
}

/* soundNow: true when we jumped here by hand (Start, skip, back), so no tone
   from a previous step is already arriving to mark the change. */
function enterStep(i, soundNow){
  run.i = i;
  var s = run.steps[i];
  run.elapsedBefore = run.steps.slice(0, i).reduce(function(a,x){ return a + x.dur; }, 0);
  run.endAt = Date.now() + s.dur * 1000;

  document.documentElement.style.setProperty("--phase", "var(" + PHASE_VAR[s.kind] + ")");

  $("phaseLabel").textContent = s.label;
  $("exerciseLabel").textContent = s.name || "";
  $("roundTag").textContent = s.round ? "Round " + s.round + " / " + s.of : "";

  var next = run.steps[i+1];
  $("nextUp").innerHTML = next
    ? 'Next <b>' + escapeHtml(next.label) + (next.name ? " · " + escapeHtml(next.name) : "") + " " + next.dur + 's</b>'
    : 'Last one';

  // the last three seconds are tinted with whatever comes next
  document.documentElement.style.setProperty("--next",
    "var(" + (next ? PHASE_VAR[next.kind] : "--done") + ")");
  // NEVER hush here: this line is immediately followed by speaking the cue for
  // the step being entered, and cancel()-then-speak() is the iOS race that
  // drops the utterance and can wedge the engine for the whole session.
  resetCountdown(false);

  clearScheduled(soundNow ? null : "change");
  run.cues = buildCues(s.dur, next ? next.kind : null);
  if(!run.paused){
    ensureAudio();
    // Announce the step we are entering. Driven by the transition itself rather
    // than a timer due at the same instant, which is what kept losing it.
    emit(s.kind, 0.02, null);
    if(soundNow) sayCue(s.kind, 0);   // on a natural advance it was spoken early
    scheduleStepCues(s.dur);
  } else {
    clearCueTimers();
  }
  if(!state.sound) markVoice("sound off — tap the speaker");
  flashScreen();
  buzz(s.kind === "work" ? [30,60,30] : 40);
}

/* hush only when we jumped by hand. On a natural change the cue for the step we
   are entering ("Go", "Rest", "Finished") is already speaking at this exact
   instant — cancelling here is what silenced every one of them. */
function resetCountdown(hush){
  run.lastCd = 0;
  $("run").classList.remove("counting");
  $("ghost").classList.remove("pop");
  $("ghost").textContent = "";
  if(hush) hushVoice();
}

function showGhost(n){
  var g = $("ghost");
  g.textContent = String(n);
  g.classList.remove("pop");
  void g.offsetWidth;           // force the animation to restart on each second
  g.classList.add("pop");
}

function escapeHtml(t){
  return String(t).replace(/[&<>"]/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c];
  });
}

function advance(natural){
  if(run.i + 1 < run.steps.length){ enterStep(run.i + 1, !natural); }
  else finish(!natural);
}

function goPrev(){
  var s = run.steps[run.i];
  var spent = s.dur - remaining();
  // first tap restarts the current step, second goes back one
  if(spent > 2 || run.i === 0) enterStep(run.i, true);
  else enterStep(run.i - 1, true);
}

function remaining(){
  if(run.paused) return run.leftWhenPaused;
  return Math.max(0, (run.endAt - Date.now()) / 1000);
}

function setPaused(p){
  if(!run.active || run.done) return;
  run.paused = p;
  if(p){
    run.leftWhenPaused = remaining();
    clearScheduled();
    clearCueTimers();
    hushVoice();
    $("run").classList.remove("counting");
    keepScreenOn(false);
  } else {
    ensureAudio();
    run.endAt = Date.now() + run.leftWhenPaused * 1000;
    scheduleStepCues(run.leftWhenPaused);   // re-arm whatever is still ahead
    keepScreenOn(true);
  }
  $("run").classList.toggle("paused", p);
  $("playBtn").setAttribute("aria-label", p ? "Resume" : "Pause");
  $("playIcon").innerHTML = p ? '<path d="M7 4l13 8-13 8z"/>' : '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
}

function finish(soundNow){
  run.done = true;
  clearCueTimers();
  resetCountdown(false);        // "Finished" is spoken just below
  // the closing cue belongs to finishing, not to the last step's timer
  clearScheduled();
  ensureAudio();
  emit("done", 0.02, null);
  if(soundNow) sayCue("done", 0);   // likewise — already spoken just before the end
  buzz([80,80,80,80,180]);
  keepScreenOn(false);
  $("clockZone").hidden = true;
  $("controls").hidden = true;
  $("endRow").hidden = true;
  $("doneCard").hidden = false;
  document.documentElement.style.setProperty("--phase", "var(--done)");
  var total = totalOf(run.steps);
  var rounds = run.steps.filter(function(s){ return s.kind === "work"; }).length;
  $("doneSub").textContent = rounds + " rounds · " + human(total);
  $("railFill").style.width = "100%";
}

function endRun(){
  run.active = false; run.done = false;
  clearScheduled();
  clearCueTimers();
  resetCountdown(true);
  keepScreenOn(false);
  $("run").classList.remove("on", "paused");
  document.documentElement.style.setProperty("--phase", "var(--work)");
  setPausedIcon(false);
}
function setPausedIcon(p){
  $("playIcon").innerHTML = p ? '<path d="M7 4l13 8-13 8z"/>' : '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
}

/* one clock, driven by wall time, so a throttled tab catches up instead of drifting */
function tick(){
  if(!run.active){ run.looping = false; return; }
  frame();
  requestAnimationFrame(tick);
}

/* A backgrounded tab stops painting frames, so the same work also runs on a
   timer. Both paths are safe to run in the same moment: cues fire once, and the
   DOM writes land on the same values. */
setInterval(function(){ if(run.active && !run.paused) frame(); }, 250);

function frame(){
  if(!run.done){
    var s = run.steps[run.i];
    var left = remaining();

    if(left <= 0 && !run.paused){ advance(true); }
    else {
      $("clock").textContent = mmss(left);
      $("stepFill").style.width = (s.dur ? (left / s.dur) * 100 : 0) + "%";

      // final three seconds: big 3 · 2 · 1 behind the clock, in step with the beeps.
      // The window is exactly 3s — any slack above it and ceil() opens on "4".
      var counting = !run.paused && left > 0 && left <= 3;
      $("run").classList.toggle("counting", counting);
      if(counting){
        var cd = Math.min(3, Math.ceil(left));
        if(cd !== run.lastCd){ run.lastCd = cd; showGhost(cd); }
      } else if(run.lastCd){
        run.lastCd = 0;
      }

      var doneSecs = run.elapsedBefore + (s.dur - left);
      var total = totalOf(run.steps);
      $("railFill").style.width = (total ? (doneSecs / total) * 100 : 0) + "%";
      $("leftTag").textContent = mmss(total - doneSecs) + " left";
    }
  }
}

/* ============================ run controls ============================ */

$("startBtn").addEventListener("click", function(){ unlockAudio(); unlockMedia(); startRun(); });
$("playBtn").addEventListener("click", function(){ setPaused(!run.paused); });
$("skipBtn").addEventListener("click", function(){ if(!run.done) advance(false); });
$("prevBtn").addEventListener("click", function(){ if(!run.done) goPrev(); });
$("againBtn").addEventListener("click", function(){ startRun(); });
$("closeBtn").addEventListener("click", endRun);

/* hold to end — a stray tap mid-workout should not kill the session */
(function(){
  var btn = $("endBtn"), timer = null;
  function arm(e){
    if(e.type === "mousedown" && e.button !== 0) return;
    btn.classList.add("arming");
    timer = setTimeout(function(){ btn.classList.remove("arming"); endRun(); }, 760);
  }
  function disarm(){
    btn.classList.remove("arming");
    if(timer){ clearTimeout(timer); timer = null; }
  }
  btn.addEventListener("mousedown", arm);
  btn.addEventListener("touchstart", arm, { passive:true });
  ["mouseup","mouseleave","touchend","touchcancel","blur"].forEach(function(ev){
    btn.addEventListener(ev, disarm);
  });
})();

document.addEventListener("keydown", function(e){
  if(!run.active) return;
  if(e.key === " "){ e.preventDefault(); setPaused(!run.paused); }
  else if(e.key === "ArrowRight"){ e.preventDefault(); if(!run.done) advance(false); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); if(!run.done) goPrev(); }
  else if(e.key === "Escape"){ e.preventDefault(); endRun(); }
});

/* ============================ go ============================ */

renderAll();
})();
</script>

</body></html>
