<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1d1a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home">
<title>Ghislain's Apps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter+Tight:wght@400;500;600&display=swap">
<style>
/* Layout: fixed sidebar of apps on the left, the selected app filling the right. On phones the sidebar becomes a slide-in drawer. */
:root{
  --bg:#f4f1ea; --side:#ebe6db; --surface:#fbf9f4; --ink:#2b2a26; --muted:#77736a; --line:#dcd5c7;
  --accent:#5f7a5f; --accent-soft:#dfe6d9;
  --display:"Fraunces",Georgia,serif; --body:"Inter Tight",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1b1d1a; --side:#151714; --surface:#22251f; --ink:#e9e4d8; --muted:#9c978b; --line:#30342d;
  --accent:#9cb894; --accent-soft:#2c3529; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
aside{width:250px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));gap:14px;overflow-y:auto}
.brand{font-family:var(--display);font-weight:600;font-size:21px;padding:0 10px}
.group{display:flex;flex-direction:column;gap:2px}
.group h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 10px 4px}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;font-size:14.5px;line-height:1.25}
.item:hover{background:var(--accent-soft)}
.item[aria-current="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.item span{flex:1;min-width:0}
.item .ext{font-size:12px;color:var(--muted);flex:none}
.item[aria-current="true"] .ext{color:inherit}
.foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px}
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{display:none}
iframe{flex:1;width:100%;border:0;background:var(--surface)}
.outside{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.outside div{max-width:340px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.outside h1{font-family:var(--display);font-weight:600;font-size:26px;margin:0}
.outside p{margin:0;color:var(--muted);line-height:1.5}
.open{display:inline-block;background:var(--accent);color:var(--surface);text-decoration:none;font-weight:600;padding:11px 20px;border-radius:999px}
.scrim{display:none}
@media (max-width:760px){
  aside{position:fixed;inset:0 auto 0 0;z-index:3;width:82%;max-width:300px;transform:translateX(-100%);transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.menu aside{transform:none}
  body.menu .scrim{display:block;position:fixed;inset:0;z-index:2;background:rgba(0,0,0,.3)}
  .top{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:var(--side);border-bottom:1px solid var(--line)}
  .top button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}
  .top b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<aside id="side" aria-label="Apps">
  <div class="brand">My apps</div>
  <nav id="nav"></nav>
</aside>
<div class="scrim" id="scrim"></div>
<main>
  <div class="top"><button id="menu" aria-label="Show apps">☰ Apps</button><b id="cur"></b></div>
  <div id="view" style="flex:1;display:flex;min-height:0"></div>
</main>
<script>
const APPS=[
 {g:"Daily",t:"Kotoba Deck",u:"/Kotoba-deck/"},
 {g:"Daily",t:"Morning Bell",u:"/morning-bell/"},
 {g:"Money",t:"Net Worth Ledger",u:"/net-worth/"},
 {g:"Money",t:"Annonces Montpellier",u:"/annonces/"},
 {g:"Trips",t:"Taipei Trip",u:"/taipei/"}
];
const local=a=>a.u.startsWith("/");
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let sel=0;try{const s=localStorage.getItem("hub-app");const i=APPS.findIndex(a=>a.u===s);if(i>=0)sel=i}catch(e){}
function nav(){
  const gs=[...new Set(APPS.map(a=>a.g))];
  document.getElementById("nav").innerHTML=gs.map(g=>`<div class="group"><h2>${esc(g)}</h2>${APPS.map((a,i)=>a.g!==g?"":`<button class="item" data-i="${i}" aria-current="${i===sel}"><span>${esc(a.t)}</span>${local(a)?"":'<span class="ext">↗</span>'}</button>`).join("")}</div>`).join("");
}
function show(i){
  sel=i;try{localStorage.setItem("hub-app",APPS[i].u)}catch(e){}
  const a=APPS[i],v=document.getElementById("view");
  document.getElementById("cur").textContent=a.t;
  v.innerHTML=local(a)?`<iframe src="${esc(a.u)}" title="${esc(a.t)}" allow="autoplay; screen-wake-lock; clipboard-write"></iframe>`
    :`<div class="outside"><div><h1>${esc(a.t)}</h1><p>${esc(a.d||"")}${a.d?" ":""}This one lives in Claude, so it opens there.</p><a class="open" href="${esc(a.u)}" target="_blank" rel="noopener">Open in Claude ↗</a></div></div>`;
  nav();document.body.classList.remove("menu");
}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest(".item");if(!b)return;const i=+b.dataset.i;if(!local(APPS[i]))window.open(APPS[i].u,"_blank","noopener");show(i)});
document.getElementById("menu").addEventListener("click",()=>document.body.classList.add("menu"));
document.getElementById("scrim").addEventListener("click",()=>document.body.classList.remove("menu"));
show(sel);
</script>
</body>
</html>
